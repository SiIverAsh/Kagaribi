[project]
name = "kagaribi"
version = "0.1.0"
description = "🔥 番剧采集源健康度探针 | 自动检测 Kazumi / Miru 规则存活性，每 6 小时更新源榜单"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx[http2]>=0.27.0",
    "jsonpath-ng>=1.6.1",
    "lxml>=5.2.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
deep = [
    "playwright>=1.44.0",
]
playwright = [
    "playwright>=1.44.0",
]

[project.scripts]
kagaribi = "kagaribi.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "respx>=0.21.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kagaribi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
